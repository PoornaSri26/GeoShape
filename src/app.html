<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>GeoShape — Guess the Country by Its Outline</title>
		<meta
			name="description"
			content="GeoShape is a free multiplayer geography game. Guess countries, US states, German states and continents from their bare outline — solo or with friends!"
		/>
		<meta name="keywords" content="geography game, guess the country, map quiz, multiplayer, countries, states, continents, outline" />

		<!-- Favicons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-light.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>

		<!-- Theme color for browser chrome (matches GeoShape's main yellow) -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4e3bf" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="GeoShape — Guess the Country by Its Outline" />
		<meta
			property="og:description"
			content="Free multiplayer geography game. Guess countries, states & continents from their silhouette — solo or with friends!"
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="GeoShape — Guess the Country by Its Outline" />
		<meta
			name="twitter:description"
			content="Free multiplayer geography game. Guess countries, states & continents from their silhouette!"
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/og-image.png" />

		<!-- Satoshi & Fredoka fonts for cute playful theme -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap" rel="stylesheet">
		<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
		<link
			href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
